name: HEP-CE Unit Tests
# Schema: https://json.schemastore.org/github-action.json

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

jobs:
    unit-testing:
        name: Testing ${{ matrix.os }} ${{matrix.build-variant}} build
        runs-on: ${{ matrix.os }}
        defaults:
            run:
                shell: bash

        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest] # macos-latest
                build-variant: [shared, static]
                include:
                    - os: ubuntu-latest
                      toolset: gcc
                    - os: windows-latest
                      toolset: mingw
        steps:
            - name: Checkout HEP-CE
              uses: actions/checkout@v6

            - name: Install Boost
              uses: MarkusJx/install-boost@v2
              id: install-boost
              with:
                  boost_version: 1.84.0
                  toolset: ${{ matrix.toolset}}

            - name: Run Testing Workflow
              continue-on-error: true
              run: cmake --workflow --preset debug-${{matrix.build-variant}}
              env:
                  BOOST_ROOT: ${{ steps.install-boost.outputs.BOOST_ROOT }}
              timeout-minutes: 10
            - name: Print DLL Locations
              if: matrix.os == 'windows-latest'
              run: |
                  where libstdc++.6.dll; where libgcc_s_seh-1.dll; where libwinpthread-1.dll; where libgomp-1.dll
