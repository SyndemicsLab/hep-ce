name: HEP-CE Unit Tests
# Schema: https://json.schemastore.org/github-action.json

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

jobs:
    unit-testing:
        name: Testing ${{ matrix.os }} ${{matrix.build-variant}} build
        runs-on: ${{ matrix.os }}
        defaults:
            run:
                shell: bash

        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest] # macos-latest
                build-variant: [shared, static]
                include:
                    - os: ubuntu-latest
                      toolset: gcc
                    - os: windows-latest
                      toolset: mingw
        steps:
            - name: Checkout HEP-CE
              uses: actions/checkout@v6

            - name: Install Boost
              uses: MarkusJx/install-boost@v2
              id: install-boost
              with:
                  boost_version: 1.84.0
                  toolset: ${{ matrix.toolset}}

            - name: Run Testing Workflow
              continue-on-error: true
              run: cmake --workflow --preset debug-${{matrix.build-variant}}
              env:
                  BOOST_ROOT: ${{ steps.install-boost.outputs.BOOST_ROOT }}
              timeout-minutes: 10

            - name: Print PATH as seen by bash
              run: echo "$PATH" | tr ';' '\n'
            - name: Check MinGW runtime files exist at expected location
              run: |
                  ls -l /c/mingw64/bin/libstdc++-6.dll;
                  ls -l /c/mingw64/bin/libgcc_s_seh-1.dll;
                  ls -l /c/mingw64/bin/libwinpthread-1.dll;
                  ls -l /c/mingw64/bin/libgomp-1.dll;
            - name: Check what Windows PATH resolution sees
              run: |
                  where.exe libstdc++-6.dll;
                  where.exe libgcc_s_seh-1.dll;
                  where.exe libwinpthread-1.dll;
                  where.exe libgomp-1.dll;
            - name: Inspect what the test exe imports
              run: |
                  objdump -p build/${{matrix.build-variant}}/bin/hepce_tests.exe | grep "DLL Name"
            - name: Directly run discovery command manually to capture stderr
              run: build/static/bin/hepce_tests.exe --gtest_list_tests
