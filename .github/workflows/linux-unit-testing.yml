name: Linux HEP-CE Unit Tests
# Schema: https://json.schemastore.org/github-action.json

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

jobs:
    unit-testing:
        name: Testing ${{ matrix.os }} ${{ matrix.build-variant }} build
        runs-on: ${{ matrix.os }}
        defaults:
            run:
                shell: bash

        strategy:
            matrix: {include: [{os: ubuntu-latest, build-variant: shared, test-preset: test-release}, {os: ubuntu-latest, build-variant: static, test-preset: test-release-static}]}
        steps:
            - name: Checkout HEP-CE
              uses: actions/checkout@v6

            - name: Install Boost
              uses: MarkusJx/install-boost@v2
              id: install-boost
              with:
                  boost_version: 1.84.0
                  toolset: gcc

            - name: Run Testing Workflow
              run: cmake --workflow --preset ${{ matrix.test-preset }}
              env:
                  BOOST_ROOT: ${{ steps.install-boost.outputs.BOOST_ROOT }}
              timeout-minutes: 10
